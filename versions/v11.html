<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>갈래 로비 · 유운식 포트폴리오</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+KR:wght@600;900&display=swap">
<style>
/* VOICE: 밝은 캐주얼 온라인 게임 로비. 들어오면 광장에 서 있고, 판넬을 눌러 갈래를 고른다.
   IDEA: 「갈래」 시간 관측소의 로비 — 타일 = 갈래, 공지판 = 관측 공지, 채팅 = 시간지기와 알림.
   PICTURE: 배경 광장 장면(사용자 지브리풍 이미지 img/lobby.jpg) 위에 반투명 파란 판넬.
   COLOUR/TYPE: 하늘색·파란 유광 판넬, 흰 글자, 금빛 포인트. Noto Sans KR 굵게, 제목 Noto Serif KR.
   LAYOUT: 상단 아이콘 바 / 왼쪽 타일 3 + 가운데 큰 타일 + 오른쪽 공지판·배너 / 왼쪽 아래 채팅 / 광장 가운데 관측자. */
:root{color-scheme:light;--p1:#38a6f0;--p2:#1f7fd6;--p3:#1764b8;--edge:rgba(255,255,255,.65);--ink:#1f2430;--gold:#ffb21e;
--cs:#1f8fd0;--city:#d98a1f;--ramp:#7a5cc7;--serif:"Noto Serif KR",serif;--sans:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%}
body{font:15px/1.5 var(--sans);color:#fff;overflow:hidden;background:#cfe9fb}
a{color:inherit;text-decoration:none}
button{font-family:inherit;color:inherit;cursor:pointer}
a:focus-visible,button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
/* 배경 장면 */
.scene{position:fixed;inset:0;background:linear-gradient(180deg,#bfe6ff 0%,#e7f6ff 46%,#f6efd9 47%,#efe3c4 100%);background-size:cover;background-position:center}
.scene .ph{position:absolute;left:70%;top:88%;transform:translate(-50%,-50%);color:#2d4a63;text-align:center;font-size:13px;background:rgba(255,255,255,.7);border:1.5px dashed rgba(0,0,0,.2);border-radius:12px;padding:8px 14px}
.scene .ph code{display:block;color:#567}
.lobby{position:relative;height:100vh;height:100dvh;padding:58px 14px 14px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr) minmax(0,.95fr);grid-template-rows:auto 1fr;gap:10px 10px;max-width:1440px;margin:0 auto}
/* 판넬 공통: 유광 파랑 */
.pn{background:linear-gradient(180deg,rgba(64,170,240,.95),rgba(29,120,210,.95));border:2px solid var(--edge);border-radius:6px;box-shadow:0 3px 0 rgba(10,60,120,.35),inset 0 1px 0 rgba(255,255,255,.45)}
/* 상단 아이콘 바 */
.bar{position:fixed;top:6px;left:50%;transform:translateX(-50%);z-index:10;display:flex;gap:6px;align-items:center;padding:4px 6px;border-radius:8px;background:linear-gradient(180deg,#cfeaff,#8cc8f4);border:2px solid #fff;box-shadow:0 3px 8px rgba(20,80,140,.25);max-width:calc(100vw - 12px);overflow-x:auto;scrollbar-width:none}
.bar a,.bar button{flex:none;display:flex;align-items:center;gap:6px;height:34px;padding:0 12px 0 6px;border-radius:6px;border:1.5px solid #fff;background:linear-gradient(180deg,#4fb2f5,#2283d8);font-size:13.5px;font-weight:700;color:#fff;white-space:nowrap;text-shadow:0 1px 0 rgba(0,40,90,.35)}
.bar a:hover,.bar button:hover{filter:brightness(1.08)}
.bar svg{width:22px;height:22px;flex:none;background:#fff;border-radius:5px;padding:3px;color:var(--p2)}
.bar .home{padding:0 6px}
.bar .gap{width:8px}
.bar .meter{flex:none;display:flex;align-items:center;height:34px;border-radius:6px;border:1.5px solid #9ccbf0;white-space:nowrap;font-size:13px;background:linear-gradient(180deg,#fff,#e6f4ff);color:var(--ink);text-shadow:none;padding:0 10px;font-weight:500;border-color:#9ccbf0}
.bar .meter b{font-variant-numeric:tabular-nums;margin-left:4px}
/* 왼쪽 타일 3개 */
.left{grid-column:1;grid-row:1;display:grid;grid-template-rows:repeat(3,minmax(0,1fr));gap:6px;height:min(40vh,300px)}
.tile{position:relative;display:block;overflow:hidden;text-align:left;padding:12px 14px;border-radius:6px}
.tile .art{position:absolute;right:0;top:0;bottom:0;width:52%;background-size:cover;background-position:center;-webkit-mask-image:linear-gradient(90deg,transparent,#000 30%);mask-image:linear-gradient(90deg,transparent,#000 30%)}
.tile .art.ph{background:linear-gradient(120deg,rgba(255,255,255,0),rgba(255,255,255,.35))}
.tile .art.ph span{position:absolute;right:8px;bottom:6px;font-size:10.5px;color:rgba(255,255,255,.85)}
.tile b{position:relative;display:block;font:900 clamp(18px,1.9vw,24px)/1.15 var(--sans);letter-spacing:-.03em;text-shadow:0 2px 0 rgba(0,40,90,.35)}
.tile small{position:relative;display:block;font-size:12px;opacity:.95;max-width:62%}
.tile .tag{position:absolute;left:8px;top:6px;font-size:11px;font-weight:700;color:#24410a;background:#c8f26a;border-radius:3px;padding:0 6px}
.tile.has-tag{padding-top:24px}
.tile:hover{filter:brightness(1.07)}
.tile .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);border:1.5px solid #fff;margin-right:6px;vertical-align:1px}
/* 가운데 큰 타일 */
.quick{grid-column:2;grid-row:1;height:min(40vh,300px);position:relative;overflow:hidden;border-radius:6px;text-align:left;padding:0}
.quick .art{position:absolute;inset:0;background:radial-gradient(circle at 70% 40%,rgba(255,236,180,.9),rgba(255,236,180,0) 45%),linear-gradient(180deg,rgba(64,170,240,.0),rgba(29,120,210,.0));background-size:cover;background-position:center}
.quick .ring{position:absolute;right:12%;top:18%;width:min(16vw,170px);aspect-ratio:1;border-radius:50%;border:2px solid rgba(255,255,255,.75);display:grid;place-items:center;text-align:center;font:700 13px/1.4 var(--sans);color:#7a5410;background:radial-gradient(circle,#fffdf3 0 40%,#ffe9b5 65%,rgba(255,233,181,0) 72%)}
.quick .ring::after{content:"";position:absolute;inset:-12px;border-radius:50%;border:1.5px solid rgba(255,255,255,.55);animation:breathe 4s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.08);opacity:.35}}
.quick .txt{position:absolute;left:16px;bottom:14px}
.quick b{display:block;font:900 clamp(30px,3.6vw,46px)/1 var(--sans);letter-spacing:-.04em;text-shadow:0 3px 0 rgba(0,40,90,.35)}
.quick small{display:block;font-size:12.5px;margin-top:6px}
.quick:hover{filter:brightness(1.06)}
/* 오른쪽: 공지판 + 배너 */
.right{grid-column:3;grid-row:1/3;display:flex;flex-direction:column;gap:8px;align-items:stretch}
.notice{padding:6px;border-radius:6px}
.notice h2{margin:0 0 6px;font-size:15px;font-weight:900;padding:2px 6px;text-shadow:0 1px 0 rgba(0,40,90,.35)}
.notice .banner{display:block;position:relative;height:clamp(84px,13vh,118px);border-radius:4px;overflow:hidden;background:linear-gradient(120deg,#fff4d1,#ffd27a);color:#4a2c00;padding:10px 12px;border:2px solid #fff}
.notice .banner b{display:block;font:900 clamp(18px,1.8vw,24px)/1.15 var(--serif);letter-spacing:-.03em}
.notice .banner span{font-size:12.5px;font-weight:500}
.notice ul{list-style:none;margin:6px 0 0;padding:4px;background:rgba(255,255,255,.95);border-radius:4px;color:var(--ink);max-height:22vh;overflow-y:auto}
.notice li a{display:block;font-size:13.5px;padding:4px 8px;border-radius:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.notice li a:hover,.notice li a:focus-visible{background:#e3f1ff}
.notice li a.new::after{content:"NEW";font-size:10px;font-weight:900;color:#fff;background:#ff6b3d;border-radius:3px;padding:0 4px;margin-left:6px;vertical-align:1px}
.banners{display:grid;gap:6px;margin-left:auto;width:min(100%,300px)}
.bn{display:grid;grid-template-columns:64px 1fr;align-items:center;gap:8px;min-height:48px;padding:4px 10px 4px 4px;border-radius:6px;text-align:center;font-size:14px;font-weight:700;line-height:1.3}
.bn i{height:40px;border-radius:4px;background:linear-gradient(135deg,#fff,#cde9ff);display:grid;place-items:center;color:var(--p3);font-style:normal;font-size:12px;font-weight:900}
.bn:hover{filter:brightness(1.07)}
/* 장면 속: 관측자 이름표 + NPC 말풍선 */
.me{position:fixed;left:50%;bottom:16vh;transform:translateX(-50%);text-align:center;pointer-events:none;z-index:1}
.me .arrow{width:0;height:0;margin:4px auto 0;border:14px solid transparent;border-top:20px solid #ff8a1e;border-bottom:0;filter:drop-shadow(0 2px 0 rgba(120,50,0,.4));animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(6px)}}
.me .tagname{display:inline-block;font-size:12.5px;font-weight:700;color:#fff;background:rgba(30,40,60,.55);border-radius:4px;padding:1px 8px}
.me .title{display:block;font-size:11.5px;color:#2a6bb0;font-weight:700;text-shadow:0 0 3px #fff}
.me .shadow{width:110px;height:18px;margin:44px auto 0;border-radius:50%;background:radial-gradient(rgba(0,0,0,.18),rgba(0,0,0,0) 70%)}
.npc{position:fixed;z-index:2;max-width:240px;text-align:left;background:linear-gradient(180deg,#9b6cf0,#7a4fd8);border:2px solid #fff;border-radius:8px;padding:6px 10px;font-size:13px;box-shadow:0 4px 10px rgba(60,30,120,.25)}
.npc b{display:block;font-size:13.5px;color:#fff6c8}
.npc::after{content:"";position:absolute;left:18px;bottom:-10px;border:8px solid transparent;border-top-color:var(--tail,#7a4fd8);border-bottom:0}
.npc:hover{filter:brightness(1.08)}
/* 채팅창 */
.chat{position:fixed;left:10px;bottom:8px;z-index:3;width:min(470px,calc(100vw - 20px));pointer-events:none}
.log{max-height:22vh;overflow:hidden;padding:6px 8px;border-radius:4px;background:rgba(20,40,70,.42);display:flex;flex-direction:column;justify-content:flex-end;gap:1px;font-size:13px;font-weight:700;text-shadow:0 1px 1px rgba(0,0,0,.55),0 0 2px rgba(0,0,0,.45)}
.log p{margin:0;animation:in .4s ease-out}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.log .sys{color:#c8ff7a}.log .keeper{color:#ffd8ff}.log .me2{color:#fff}
.chatbar{margin-top:4px;display:flex;align-items:center;gap:6px;height:24px;background:rgba(20,40,70,.55);border-radius:3px;padding:0 6px;font-size:12px}
.chatbar span{background:linear-gradient(180deg,#4fb2f5,#2283d8);border-radius:3px;padding:0 6px;font-weight:700}
/* 갈래 창 (게임 창) */
.win{position:fixed;inset:0;z-index:20;display:none;place-items:center;background:rgba(140,190,230,.35);padding:16px}
.win.on{display:grid}
.wbox{width:min(980px,100%);max-height:calc(100dvh - 32px);display:flex;flex-direction:column;border-radius:8px;overflow:hidden;background:#fff;color:var(--ink);border:2px solid #fff;box-shadow:0 18px 50px rgba(20,60,110,.35)}
.wtitle{display:flex;align-items:center;gap:10px;padding:8px 10px 8px 14px;background:linear-gradient(180deg,#4fb2f5,#1f7fd6);color:#fff;font-weight:900;text-shadow:0 1px 0 rgba(0,40,90,.35)}
.wtitle .x{margin-left:auto;width:34px;height:30px;border-radius:5px;border:1.5px solid #fff;background:linear-gradient(180deg,#ff8a6b,#e2553a);font-weight:900;font-size:16px}
.wscroll{overflow-y:auto}
.hero{position:relative;height:clamp(150px,26vh,240px);background-size:cover;background-position:center;display:flex;align-items:flex-end;padding:16px 20px}
.hero .ph{position:absolute;right:16px;top:12px;font-size:12px;color:#3d4a55;background:rgba(255,255,255,.75);border:1.5px dashed rgba(0,0,0,.2);border-radius:10px;padding:4px 10px}
.hero .card{position:relative;background:rgba(255,255,255,.93);border-radius:14px;padding:12px 16px;max-width:560px}
.hero small{font-weight:700;color:var(--c);font-size:12.5px}
.hero h2{font:900 clamp(26px,3vw,36px)/1.1 var(--serif);letter-spacing:-.03em;margin:2px 0 4px}
.hero p{margin:0;color:#3d4452}
.wbody{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:22px;padding:20px}
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl::before{content:"";position:absolute;left:11px;top:8px;bottom:8px;width:2px;background:linear-gradient(#dfe6ee,#e0a53a 45%,var(--c))}
.tl li{position:relative;padding:0 0 18px 38px}
.tl li::before{content:"";position:absolute;left:4px;top:5px;width:16px;height:16px;border-radius:50%;background:#fff;border:2.5px solid #b9c4cf}
.tl li.fork::before{border-color:#e0a53a;background:#fbe6b8}
.tl li.new::before,.tl li.future::before{border-color:var(--c);background:var(--c)}
.tl li.now::before{border-color:var(--c);background:var(--c);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px color-mix(in srgb,var(--c) 22%,transparent)}}
.tl small{display:block;font-size:12px;font-weight:700;color:#5f6878}
.tl h3{font-size:18px;letter-spacing:-.025em;margin:1px 0 4px;line-height:1.3}
.tl p{margin:0 0 4px;color:#3d4452;font-size:14.5px}
.tl .orig{font-size:12.5px;color:#5f6878}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.chips span{font-size:12.5px;background:#f1f6fb;border:1px solid #dfe6ee;border-radius:999px;padding:2px 9px}
.enter{display:inline-flex;align-items:center;min-height:46px;padding:10px 20px;border-radius:8px;border:2px solid #fff;background:linear-gradient(180deg,#ffc94a,#f39a12);color:#4a2600;font-size:16px;font-weight:900;box-shadow:0 3px 0 #b86d00}
.enter:hover{filter:brightness(1.05)}
.side{background:#f4f8fc;border:1px solid #dfe6ee;border-radius:12px;padding:14px;align-self:start}
.side dl{margin:0;display:grid;gap:8px}
.side dt{font-size:11.5px;color:#5f6878;font-weight:700}
.side dd{margin:0;font-size:14.5px;font-weight:500}
.side a{display:block;margin-top:12px;text-align:center;font-weight:700;font-size:13.5px;border:1.5px solid var(--ink);border-radius:999px;padding:9px;background:#fff}
.draft{display:inline-block;font-size:11.5px;color:#5f6878;background:#fff;border:1px solid #dfe6ee;border-radius:999px;padding:1px 9px;margin-bottom:10px}
.copy{font-size:12px;font-weight:600;border:1px solid #dfe6ee;background:#fff;border-radius:999px;padding:2px 9px;margin-left:6px}
.page{padding:22px;color:var(--ink)}
.page h2{font:900 26px/1.2 var(--serif);margin:0 0 8px}
.page p{margin:0 0 10px;color:#3d4452}
.page ol{margin:0;padding-left:20px;color:#3d4452}
/* 로딩 + 연출 */
.load{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:radial-gradient(circle,#fffdf6,#d9efff 70%);opacity:0;pointer-events:none;transition:opacity .4s;color:var(--ink)}
.load.on{opacity:1;pointer-events:auto}
.load div{text-align:center}
.load p{font:600 clamp(18px,2.4vw,24px) var(--serif);margin:0 0 14px}
.load .lb{width:240px;height:6px;border-radius:6px;background:#fff;border:1px solid #bcd9f0;overflow:hidden;margin:0 auto}
.load .lb i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffc94a,#f39a12)}
.load.on .lb i{animation:fill 1.3s ease-out forwards}
@keyframes fill{to{width:100%}}
.rv{position:fixed;inset:0;z-index:30;overflow-y:auto;background:#fff;display:none;color:var(--ink)}
.rv.on{display:block}
.rv-top{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;gap:10px;padding:10px 14px;pointer-events:none}
.rv-top>*{pointer-events:auto}
.rv-top button{font-size:14px;font-weight:700;background:rgba(255,255,255,.92);border:1px solid rgba(0,0,0,.12);border-radius:999px;padding:8px 14px;min-height:40px}
.rv-top span{margin-left:auto;font-size:13px;font-weight:700;background:rgba(255,255,255,.88);border-radius:999px;padding:6px 12px}
.reel{position:relative}
.stage{position:sticky;top:0;height:100vh;height:100dvh;overflow:hidden}
.shot{position:absolute;inset:-4%;background-size:cover;background-position:center;opacity:0;will-change:opacity,transform}
.shot.ph{display:grid;place-items:center;text-align:center;color:#3d4a55}
.shot.ph div{background:rgba(255,255,255,.75);border:1.5px dashed rgba(0,0,0,.25);border-radius:14px;padding:12px 18px;font-size:14px;max-width:80%}
.shot.ph code{display:block;font-size:13px;color:#566}
.cap{position:absolute;left:max(5vw,16px);bottom:max(9vh,64px);max-width:min(560px,calc(100vw - 32px));background:rgba(255,255,255,.92);border-radius:18px;padding:20px 24px;opacity:0;transform:translateY(14px);transition:opacity .45s,transform .45s;pointer-events:none;box-shadow:0 10px 30px rgba(40,40,30,.12)}
.cap.on{opacity:1;transform:none}
.cap small{display:block;font-weight:700;font-size:13px;color:var(--c)}
.cap h3{font:900 clamp(24px,3.2vw,36px)/1.18 var(--serif);letter-spacing:-.03em;margin:4px 0 8px;text-wrap:balance}
.cap p{margin:0;color:#3a3f4a}
.dots{position:absolute;right:max(3vw,14px);top:50%;transform:translateY(-50%);display:grid;gap:10px}
.dots i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.75);border:1.5px solid rgba(0,0,0,.25);transition:.3s}
.dots i.on{background:var(--c);border-color:var(--c);transform:scale(1.3)}
.end{min-height:70vh;display:grid;place-items:center;text-align:center;padding:48px 20px;background:linear-gradient(#e7f5ff,#fff)}
.end h2{font:900 clamp(26px,3.4vw,40px)/1.2 var(--serif);letter-spacing:-.03em;margin:0 0 10px}
.end p{color:#5f6878;margin:0 0 22px}
.end .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.end a,.end button{min-height:46px;padding:11px 20px;border-radius:8px;font-weight:700;font-size:15px;border:1.5px solid var(--ink);background:#fff}
.end .pri{background:linear-gradient(180deg,#ffc94a,#f39a12);border-color:#fff;color:#4a2600;box-shadow:0 3px 0 #b86d00}
.foot{position:fixed;right:10px;bottom:8px;z-index:3;font-size:11.5px;color:#2d4a63;background:rgba(255,255,255,.75);border-radius:4px;padding:2px 8px}
@media(max-width:1000px){
 body{overflow:auto}.lobby{height:auto;grid-template-columns:1fr 1fr;padding-top:56px}
 .left{grid-column:1;height:auto;grid-template-rows:none}.tile{min-height:84px}
 .quick{grid-column:2;height:auto;min-height:260px}
 .right{grid-column:1/-1;grid-row:auto}.banners{width:100%;grid-template-columns:repeat(3,1fr);margin:0}
 .me,.npc{display:none}.chat{position:static;width:auto;padding:0 14px 50px}.foot{position:static;display:block;margin:0 14px 14px}
 .wbody{grid-template-columns:1fr}
}
@media(max-width:600px){.lobby{grid-template-columns:1fr}.quick{grid-column:1}.banners{grid-template-columns:1fr}.bar .lbl{display:none}.bar a,.bar button{padding:0 6px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="scene" id="scene"><div class="ph">로비 배경 자리<code>img/lobby.jpg</code></div></div>

<nav class="bar" aria-label="메뉴">

function tick(){

  while(si<SCRIPT.length&&s>=SCRIPT[si][0]){const [,c,w,m]=SCRIPT[si++];say(c,w,typeof m==='function'?m():m)}

  <p>게임마다 원래의 시간이 흐르다, 몰입이 끊기는 지점에서 갈라집니다. 그 분기점에서 갈라져 나온 새 갈래가 제 기획입니다.</p>
  <ol><li>지친 현업자가 쉬듯 둘러보도록, 익숙한 게임 로비 문법으로 만들었습니다.</li>
  <li>게임사나 장르 대신 ‘시간을 어떻게 바꿨는지’로 나눴습니다. 장르를 바꾼 기획이라 그게 정직한 분류입니다.</li>
  <li>관측 시간은 이 페이지를 연 순간부터 흐릅니다. 시계를 보지 않게 되는 것, 그게 제가 만들고 싶은 몰입입니다.</li></ol></div>`]};
function openPage(k){const p=PAGES[k];if(p)openWin(p[0],p[1])}

document.addEventListener('click',e=>{
  const o=e.target.closest('[data-open]');if(o){e.preventDefault();openWorld(o.dataset.open);return}
  const pg=e.target.closest('[data-page]');if(pg){e.preventDefault();openPage(pg.dataset.page);return}
  const en=e.target.closest('[data-enter]');if(en){closeWin();enter([en.dataset.enter]);return}
  if(e.target.closest('[data-close]')){closeWin();closeReel();return}
  const nx=e.target.closest('[data-next]');if(nx){closeReel(true);enter(queue);return}
  const cp=e.target.closest('.copy');if(cp){copy(cp)}
  if(e.target===win)closeWin();
});
addEventListener('keydown',e=>{if(e.key==='Escape'){closeWin();closeReel()}});
document.getElementById('quick').addEventListener('click',()=>{say('keeper','시간지기','차례로 안내할게요.');enter(['crazy-splash','summoners-city'])});
async function copy(b){try{await navigator.clipboard.writeText(b.dataset.copy);b.textContent='복사됨'}catch(e){b.textContent='길게 눌러 복사'}setTimeout(()=>b.textContent='복사',1600)}

/* 들어가기 → 로딩 → 연출 (바로 관측은 여러 갈래를 이어서) */
const load=document.getElementById('load'),rv=document.getElementById('rv');
let R=null,queue=[];
function enter(ids){
  ids=[...ids];const w=W(ids.shift());if(!w)return;queue=ids;
  document.getElementById('loadText').textContent=w.load;load.classList.add('on');
  setTimeout(()=>{openReel(w);load.classList.remove('on')},reduce?200:1450);
}
function openReel(w){
  const n=w.shots.length,next=queue.length?W(queue[0]):null;
  rv.style.setProperty('--c',w.c);
  rv.innerHTML=`<div class="rv-top"><button type="button" data-close>← 로비로</button><span id="rvCount">${esc(w.name)} · 1 / ${n}</span></div>
   <div class="reel" style="height:${n*100+40}vh"><div class="stage" style="background:${grad[w.c]}">
    ${w.shots.map(s=>`<div class="shot ph" style="background:${grad[w.c]}"><div>${esc(s.scene)}<code>이미지 자리 · ${esc(s.img)}</code></div></div>`).join('')}
    ${w.shots.map(s=>`<div class="cap"><small>${esc(s.kicker)}</small><h3>${esc(s.title)}</h3><p>${esc(s.text)}</p></div>`).join('')}
    <div class="dots" aria-hidden="true">${w.shots.map(()=>'<i></i>').join('')}</div></div></div>
   <section class="end"><div><h2>이 갈래의 미래, 여기까지.</h2><p>${esc(w.ask)}</p><div class="row">
    ${next?`<button class="pri" type="button" data-next>다음 갈래 · ${esc(next.name)} ▶</button>`:''}
    ${w.site?`<a class="${next?'':'pri'}" href="${UP}${esc(w.site)}">${esc(w.siteLabel)} ↗</a>`:''}
    <button type="button" data-close>로비로 돌아가기</button></div></div></section>`;
  const shots=[...rv.querySelectorAll('.shot')];
  w.shots.forEach((s,i)=>tryImg(s.img,src=>{const d=shots[i];d.classList.remove('ph');d.innerHTML='';d.style.background=`url("${src}") center/cover`}));
  R={w,n,reel:rv.querySelector('.reel'),shots,caps:[...rv.querySelectorAll('.cap')],dots:[...rv.querySelectorAll('.dots i')],count:rv.querySelector('#rvCount'),cur:-2,idx:-1};
  rv.classList.add('on');rv.scrollTop=0;update();rv.querySelector('[data-close]').focus();
}
function closeReel(keep){if(!rv.classList.contains('on'))return;rv.classList.remove('on');rv.innerHTML='';const w=R&&R.w;R=null;if(!keep){queue=[];w&&say('keeper','시간지기',`${w.name} 갈래에서 돌아왔어요.`)}}
let mx=0,my=0,tx=0,ty=0;
addEventListener('pointermove',e=>{tx=e.clientX/innerWidth*2-1;ty=e.clientY/innerHeight*2-1},{passive:true});
const sm=t=>t<=0?0:t>=1?1:t*t*(3-2*t);
function update(){
  if(!R)return;
  const vh=rv.clientHeight,total=R.reel.offsetHeight-vh;
  const p=Math.min(Math.max(rv.scrollTop/total,0),.9999),pos=p*R.n,i=Math.floor(pos),t=pos-i;
  R.shots.forEach((s,j)=>{const o=j===i?1:j===i+1?sm((t-.72)/.28):0;const sc=reduce?1:1.06-.05*(j===i?t:0);
    s.style.opacity=o;s.style.transform=reduce?'none':`translate3d(${-mx*14}px,${-my*9}px,0) scale(${sc})`});
  const show=(t>.06&&(t<.8||i===R.n-1))?i:-1;
  if(show!==R.cur){R.cur=show;R.caps.forEach((c,j)=>c.classList.toggle('on',j===show))}
  if(i!==R.idx){R.idx=i;R.dots.forEach((d,j)=>d.classList.toggle('on',j===i));R.count.textContent=`${R.w.name} · ${i+1} / ${R.n}`}
}
rv.addEventListener('scroll',update,{passive:true});
(function frame(){mx+=(tx-mx)*.06;my+=(ty-my)*.06;update();requestAnimationFrame(frame)})();
}
</script>
</body></html>
